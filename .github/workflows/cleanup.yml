name: Cleanup

on:
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:

permissions:
    contents: read
    actions: write
    packages: write

jobs:
    delete-old-runs:
        runs-on: ubuntu-latest
        steps:
            - name: Delete workflow runs older than 7 days
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RETENTION_DAYS: '7'
              run: |
                  set -euo pipefail
                  cutoff="$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
                  echo "LOG: Deleting runs created before $cutoff"
                  gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
                    --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" |
                  while read -r id; do
                    [ -z "$id" ] && continue
                    echo "LOG: Deleting run $id"
                    gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" || true
                  done

    prune-package-versions:
        runs-on: ubuntu-latest
        steps:
            - name: Keep only the newest container package versions
              uses: actions/delete-package-versions@v5
              with:
                  package-name: microsoft-rewards-script
                  package-type: container
                  min-versions-to-keep: 6
                  ignore-versions: '^latest$'
